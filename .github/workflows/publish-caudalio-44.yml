name: Publish verified CAUDALIO 4.4 installers
on:
  push:
    paths: ['.github/workflows/publish-caudalio-44.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and verify exact native installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/publish-caudalio44.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v4.4.0 release/* --repo caudalio/downloads --target "$GITHUB_SHA" --title 'CAUDALIO 4.4 — Multi-canvas' --notes-file .github/release-caudalio44.txt --latest
