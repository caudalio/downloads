name: Publish corrected Windows trial
on:
  push:
    paths: [".github/workflows/releases.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Apply verified Windows fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v3.7 --repo caudalio/downloads --pattern CAUDALIO-3.7-Windows.zip --dir original
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request, zipfile, hashlib, shutil
          old=Path('original/CAUDALIO-3.7-Windows.zip')
          assert hashlib.sha256(old.read_bytes()).hexdigest()=='a7c5f696443057f84f1a622d907d742d7370093c0e51a9b0f8e00232dfc0b836'
          request=urllib.request.Request('https://caudalio.net/downloads/windows-trial-fix.zip',headers={'User-Agent':'Mozilla/5.0'})
          patch=Path('fix.zip');patch.write_bytes(urllib.request.urlopen(request,timeout=120).read())
          with zipfile.ZipFile(old) as z: z.extractall('work')
          roots=list(Path('work').iterdir());assert len(roots)==1 and roots[0].is_dir()
          root=roots[0]
          with zipfile.ZipFile(patch) as z: z.extractall(root)
          assert hashlib.sha256((root/'CAUDALIO.exe').read_bytes()).hexdigest()=='2556be4a607087a7160713a2bc7886155843920fc374fc03eb6c8f648783bf34'
          Path('release').mkdir()
          target=Path('release/CAUDALIO-3.7-Windows.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for file in sorted(root.rglob('*')):
                  if file.is_file(): z.write(file,file.relative_to(root.parent))
          with zipfile.ZipFile(target) as z: assert z.testzip() is None
          print('Verified corrected executable and complete ZIP:',hashlib.sha256(target.read_bytes()).hexdigest())
          PY
      - name: Replace Windows archive only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v3.7 release/CAUDALIO-3.7-Windows.zip --repo caudalio/downloads --clobber
